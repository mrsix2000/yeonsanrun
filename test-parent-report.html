<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연산런 학부모 리포트 테스트</title><link rel="stylesheet" href="./src/styles.css?v=010-1"><script type="module" src="./src/test-parent-report.js?v=010-1"></script></head>
<body><main class="shell"><section class="panel"><h1>학부모 자녀별 학습 리포트 테스트</h1>
<p>테스트 DB 전용 화면입니다. 운영 계정과 운영 DB를 사용하지 않습니다. 사전에 승인된 자녀 연결만 조회합니다.</p>
<p id="parent-state" role="status">연결 준비 중</p>
<form id="parent-login"><label for="parent-email">테스트 학부모 이메일</label><input id="parent-email" type="email" required autocomplete="email"><label for="parent-password">비밀번호</label><input id="parent-password" type="password" required><button type="submit">로그인</button></form>
<button id="parent-logout" type="button" disabled>로그아웃</button>
<h2>연결된 자녀</h2><button id="parent-refresh" type="button" disabled>자녀 목록 새로고침</button>
<ul id="parent-children"></ul>
<h2>선택한 자녀의 학습 현황</h2><div id="parent-summary" aria-live="polite">자녀를 선택하면 기록이 표시됩니다.</div>
<p>자녀가 보이지 않는다면 테스트 DB에 학부모·자녀 연결 권한이 아직 부여되지 않은 상태입니다. 임의로 연결할 수 없습니다.</p>
</section></main></body></html>
