<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14213d"><title>연산런 | 계산 실력 훈련</title><link rel="stylesheet" href="./src/styles.css"><script type="module" src="./src/main.js"></script></head>
<body><main class="shell"><header class="top"><span class="brand">연산런</span><span class="tag">새로운 시작 · 개발 버전</span></header><section class="hero"><p class="eyebrow">초1부터 중3까지</p><h1>계산 실력은<br>훈련으로 달라집니다.</h1><p>학년보다 실력 중심. 부족한 계산을 찾아 정확하고 빠르게 훈련합니다.</p><button id="start" type="button">훈련 체험 시작</button></section><section class="panel" aria-labelledby="areas-heading"><h2 id="areas-heading">8개 핵심 연산 영역</h2><div id="areas" class="areas"></div></section><section id="practice" class="panel" hidden aria-live="polite"><h2>첫 훈련 · 자연수 덧셈</h2><p class="hint">지금은 서버 저장 없는 체험 버전입니다.</p><p id="question" class="question"></p><form id="answer-form"><label for="answer">정답</label><div class="answer-row"><input id="answer" type="number" inputmode="numeric" required autocomplete="off"><button type="submit">확인</button></div></form><p id="feedback" role="status"></p><button id="next" class="secondary" type="button" hidden>다음 문제</button><p id="score"></p></section><footer>연산런 · 개발 버전 0.1.0</footer></main></body></html>
