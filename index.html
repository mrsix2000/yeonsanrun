<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14213d"><title>연산런 | 계산 실력 훈련</title><link rel="stylesheet" href="./src/styles.css?v=004-1"><script type="module" src="./src/main.js?v=004-1"></script></head>
<body><div class="shell"><header class="top"><a class="brand" href="#home" aria-label="연산런 홈">연산런</a><button class="menu-toggle secondary" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">메뉴</button><nav id="site-nav" class="site-nav" aria-label="주 메뉴"><a href="#home" data-route="home">홈</a><a href="#practice" data-route="practice">연산 훈련</a><a href="#history" data-route="history">학습 기록</a></nav></header>
<main id="main-content">
<section id="view-home" class="view" aria-labelledby="home-heading"><div class="hero"><p class="eyebrow">초1부터 중3까지</p><h1 id="home-heading">계산 실력은<br>훈련으로 달라집니다.</h1><p>학년보다 실력 중심. 부족한 계산을 찾아 정확하고 빠르게 훈련합니다.</p><button id="start" type="button">훈련 체험 시작</button></div><section class="panel" aria-labelledby="areas-heading"><h2 id="areas-heading">8개 핵심 연산 영역</h2><div id="areas" class="areas"></div></section></section>
<section id="view-practice" class="view" aria-labelledby="practice-heading" hidden><div class="panel"><h1 id="practice-heading">연산 훈련</h1><p class="hint">자연수 사칙연산 기초 체험입니다. 학습 기록은 아직 저장되지 않습니다.</p><h2>연산 유형 선택</h2><div id="operation-options" class="operation-options" role="group" aria-label="연산 유형 선택"></div><h2>자릿수 선택</h2><div id="digit-options" class="digit-options" role="group" aria-label="자릿수 선택"></div><div id="condition-controls"><h2>계산 조건</h2><div class="condition-options" role="group" aria-label="계산 조건"><button type="button" class="condition-button secondary" data-condition="any">전체</button><button type="button" class="condition-button secondary" data-condition="without">받아올림·받아내림 없음</button><button type="button" id="condition-with" class="condition-button secondary" data-condition="with">받아올림·받아내림 있음</button></div></div><h2 id="selected-operation">덧셈 훈련</h2><button id="begin-practice" type="button">선택한 연산 시작</button><div id="practice-session" hidden><p id="question" class="question"></p><form id="answer-form"><label for="answer">정답</label><div class="answer-row"><input id="answer" type="number" inputmode="numeric" required autocomplete="off"><button type="submit">확인</button></div></form><p id="feedback" role="status"></p><button id="next" class="secondary" type="button" hidden>다음 문제</button><p id="score"></p></div></div></section>
<section id="view-history" class="view" aria-labelledby="history-heading" hidden><div class="panel"><h1 id="history-heading">학습 기록</h1><p>학습 기록 저장 및 분석 기능은 아직 개발 전입니다.</p><p class="hint">현재 체험 점수는 서버에 저장되지 않으며, 이 화면에 실제 기록이 표시되지 않습니다.</p><button id="history-to-practice" type="button">연산 훈련으로 이동</button></div></section>
</main><footer>연산런 · 개발 버전 0.4.0</footer></div></body></html>
